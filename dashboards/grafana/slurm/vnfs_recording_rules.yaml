        expr: sum (vnfs_READ_ERRORS{job="vnfs-collector"}) / 30
      - record: vnfs:errors:by_op_type
        labels:
          op_type: write
        expr: sum (vnfs_WRITE_ERRORS{job="vnfs-collector"}) / 30
      - record: vnfs:errors:by_op_type
        labels:
          op_type: getattr
        expr: sum (vnfs_GETATTR_ERRORS{job="vnfs-collector"}) / 30
      - record: vnfs:errors:by_op_type
        labels:
          op_type: setattr
        expr: sum (vnfs_SETATTR_ERRORS{job="vnfs-collector"}) / 30
      - record: vnfs:errors:by_op_type
        labels:
          op_type: flush
        expr: sum (vnfs_FLUSH_ERRORS{job="vnfs-collector"}) / 30
      - record: vnfs:errors:by_op_type
        labels:
          op_type: fsync
        expr: sum (vnfs_FSYNC_ERRORS{job="vnfs-collector"}) / 30
      - record: vnfs:errors:by_op_type
        labels:
          op_type: lock
        expr: sum (vnfs_LOCK_ERRORS{job="vnfs-collector"}) / 30
      - record: vnfs:errors:by_op_type
        labels:
          op_type: mmap
        expr: sum (vnfs_MMAP_ERRORS{job="vnfs-collector"}) / 30
      - record: vnfs:errors:by_op_type
        labels:
          op_type: readdir
        expr: sum (vnfs_READDIR_ERRORS{job="vnfs-collector"}) / 30
      - record: vnfs:errors:by_op_type
        labels:
          op_type: create
        expr: sum (vnfs_CREATE_ERRORS{job="vnfs-collector"}) / 30
      - record: vnfs:errors:by_op_type
        labels:
          op_type: link
        expr: sum (vnfs_LINK_ERRORS{job="vnfs-collector"}) / 30
      - record: vnfs:errors:by_op_type
        labels:
          op_type: unlink
        expr: sum (vnfs_UNLINK_ERRORS{job="vnfs-collector"}) / 30
      - record: vnfs:errors:by_op_type
        labels:
          op_type: symlink
        expr: sum (vnfs_SYMLINK_ERRORS{job="vnfs-collector"}) / 30
      - record: vnfs:errors:by_op_type
        labels:
          op_type: lookup
        expr: sum (vnfs_LOOKUP_ERRORS{job="vnfs-collector"}) / 30
      - record: vnfs:errors:by_op_type
        labels:
          op_type: rename
        expr: sum (vnfs_RENAME_ERRORS{job="vnfs-collector"}) / 30
      - record: vnfs:errors:by_op_type
        labels:
          op_type: access
        expr: sum (vnfs_ACCESS_ERRORS{job="vnfs-collector"}) / 30
      - record: vnfs:errors:by_op_type
        labels:
          op_type: mkdir
        expr: sum (vnfs_MKDIR_ERRORS{job="vnfs-collector"}) / 30
      - record: vnfs:errors:by_op_type
        labels:
          op_type: rmdir
        expr: sum (vnfs_RMDIR_ERRORS{job="vnfs-collector"}) / 30
      - record: vnfs:errors:by_op_type
        labels:
          op_type: listxattr
        expr: sum (vnfs_LISTXATTR_ERRORS{job="vnfs-collector"}) / 30

# -----------------------------------  DASHBOARD BY MOUNT  -----------------------------------
  - name: vnfs_by_mount
    interval: 30s
    rules:
      # ---------  THROUGHPUT by MOUNT  ---------
      - record: vnfs:read_bytes:by_mount
        expr: sum by (MOUNT) (vnfs_READ_BYTES{job="vnfs-collector"}) / 30
      - record: vnfs:write_bytes:by_mount
        expr: sum by (MOUNT) (vnfs_WRITE_BYTES{job="vnfs-collector"}) / 30
      # ---------  IOPS by MOUNT  ---------
      - record: vnfs:read_iops:by_mount
        expr: sum by (MOUNT) (vnfs_READ_COUNT{job="vnfs-collector"}) / 30
      - record: vnfs:write_iops:by_mount
        expr: sum by (MOUNT) (vnfs_WRITE_COUNT{job="vnfs-collector"}) / 30
      # ---------  DURATION by MOUNT  ---------
      - record: vnfs:read_duration:by_mount
        expr: sum by (MOUNT) (vnfs_READ_DURATION{job="vnfs-collector"}) / 30
      - record: vnfs:write_duration:by_mount
        expr: sum by (MOUNT) (vnfs_WRITE_DURATION{job="vnfs-collector"}) / 30
      # ---------  MD OPS by MOUNT  ---------
      - record: vnfs:metadata_ops:by_mount
        expr: sum by (MOUNT) (vnfs_OPEN_COUNT{job="vnfs-collector"}    + 
                              vnfs_CLOSE_COUNT{job="vnfs-collector"}   + 
                              vnfs_GETATTR_COUNT{job="vnfs-collector"} + 
                              vnfs_SETATTR_COUNT{job="vnfs-collector"} + 
                              vnfs_FLUSH_COUNT{job="vnfs-collector"}   + 
                              vnfs_FSYNC_COUNT{job="vnfs-collector"}   + 
                              vnfs_LOCK_COUNT{job="vnfs-collector"}    + 
                              vnfs_MMAP_COUNT{job="vnfs-collector"}    + 
                              vnfs_READDIR_COUNT{job="vnfs-collector"} + 
                              vnfs_CREATE_COUNT{job="vnfs-collector"}  + 
                              vnfs_LINK_COUNT{job="vnfs-collector"}    + 
                              vnfs_UNLINK_COUNT{job="vnfs-collector"}  + 
                              vnfs_SYMLINK_COUNT{job="vnfs-collector"} + 
                              vnfs_LOOKUP_COUNT{job="vnfs-collector"}  + 
                              vnfs_RENAME_COUNT{job="vnfs-collector"}  + 
                              vnfs_ACCESS_COUNT{job="vnfs-collector"}  + 
                              vnfs_MKDIR_COUNT{job="vnfs-collector"}   + 
                              vnfs_RMDIR_COUNT{job="vnfs-collector"}   + 
                              vnfs_LISTXATTR_COUNT{job="vnfs-collector"}) / 30
      - record: vnfs:read_metadata_ops:by_mount
        expr: sum by (MOUNT) (vnfs_GETATTR_COUNT{job="vnfs-collector"} + 
                              vnfs_MMAP_COUNT{job="vnfs-collector"}    + 
                              vnfs_READDIR_COUNT{job="vnfs-collector"} + 
                              vnfs_LOOKUP_COUNT{job="vnfs-collector"}  + 
                              vnfs_ACCESS_COUNT{job="vnfs-collector"}  + 
                              vnfs_LISTXATTR_COUNT{job="vnfs-collector"}) / 30
      - record: vnfs:write_metadata_ops:by_mount
        expr: sum by (MOUNT) (vnfs_OPEN_COUNT{job="vnfs-collector"}    + 
                              vnfs_CLOSE_COUNT{job="vnfs-collector"}   + 
                              vnfs_SETATTR_COUNT{job="vnfs-collector"} + 
                              vnfs_FLUSH_COUNT{job="vnfs-collector"}   + 
                              vnfs_FSYNC_COUNT{job="vnfs-collector"}   + 
                              vnfs_LOCK_COUNT{job="vnfs-collector"}    + 
                              vnfs_CREATE_COUNT{job="vnfs-collector"}  + 
                              vnfs_LINK_COUNT{job="vnfs-collector"}    + 
                              vnfs_UNLINK_COUNT{job="vnfs-collector"}  + 
                              vnfs_SYMLINK_COUNT{job="vnfs-collector"} + 
